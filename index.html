<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>animated-bg-lib — 30 Canvas Effects</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.08);
      --text: #e8e8f0; --muted: rgba(255,255,255,0.4); --accent: #4f9cf9;
      --panel-w: 272px; --radius: 12px;
    }
    body.light {
      --bg: #f0f0f5; --surface: rgba(0,0,0,0.04); --border: rgba(0,0,0,0.08);
      --text: #111; --muted: rgba(0,0,0,0.45);
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 22px; border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.35); backdrop-filter: blur(14px);
      position: sticky; top: 0; z-index: 50;
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }
    .badge {
      font-size: 11px; color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; margin-left: 8px;
    }
    .btn-icon {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; color: var(--text);
      cursor: pointer; font-size: 12px; transition: background .15s; font-family: inherit;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.1); }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; }

    /* ── Side Panel ── */
    .side-panel {
      width: var(--panel-w); flex-shrink: 0; padding: 16px;
      border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px;
      background: rgba(0,0,0,0.2); overflow-y: auto;
      height: calc(100vh - 51px); position: sticky; top: 51px;
    }
    .p-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 5px; }
    input[type=search] {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 7px 10px;
      font-size: 13px; outline: none; font-family: inherit;
    }
    input[type=search]:focus { border-color: var(--accent); }
    .color-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    input[type=color] {
      width: 32px; height: 28px; border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; background: none; padding: 2px; flex-shrink: 0;
    }
    .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; transition: transform .15s; }
    .sw:hover { transform: scale(1.2); }
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .cat-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .p-section { display: flex; flex-direction: column; }
    .export-col { display: flex; flex-direction: column; gap: 6px; }
    .exp-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 7px 10px; cursor: pointer; font-size: 12px;
      text-align: left; transition: background .15s; font-family: inherit; width: 100%;
    }
    .exp-btn:hover { background: rgba(79,156,249,0.12); border-color: rgba(79,156,249,0.4); }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.6; }
    #effect-sel option, #effect-sel optgroup { background: #1a1a2e; color: #eee; }
    body.light #effect-sel option, body.light #effect-sel optgroup { background: #fff; color: #111; }

    /* ── Grid ── */
    .grid-area { flex: 1; padding: 18px 20px; overflow-y: auto; }
    .cat-header {
      font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
      margin: 18px 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    .cat-header:first-child { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 12px; }

    /* ── Cards ── */
    .card {
      border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer; position: relative;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 14px 44px rgba(0,0,0,0.55); border-color: rgba(79,156,249,0.35); }
    .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,156,249,0.25); }
    canvas.prev { display: block; width: 100%; height: 150px; }
    .card-info { padding: 9px 11px 11px; }
    .card-title { font-size: 13px; font-weight: 600; }
    .card-meta { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
    .tech-badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; background: rgba(79,156,249,0.1); border: 1px solid rgba(79,156,249,0.2); color: var(--accent); }
    .fs-btn {
      position: absolute; top: 7px; right: 7px; opacity: 0;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px; color: #fff; padding: 3px 8px; font-size: 11px;
      cursor: pointer; transition: opacity .15s; backdrop-filter: blur(6px); font-family: inherit;
    }
    .card:hover .fs-btn { opacity: 1; }
    .hidden { display: none !important; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 22px; right: 22px; background: #1a1a2e;
      border: 1px solid rgba(79,156,249,0.3); color: #fff;
      padding: 10px 16px; border-radius: 9px; font-size: 13px; z-index: 200;
      transform: translateY(50px); opacity: 0; transition: all .28s; pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="logo">animated-bg<span>-lib</span></div>
      <span class="badge">v1.0 · 30 efectos</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-icon" id="theme-btn">☀ Modo claro</button>
    </div>
  </header>

  <div class="layout">
    <!-- ── Side Panel ── -->
    <aside class="side-panel">

      <div class="p-section">
        <div class="p-label">Efecto activo</div>
        <select id="effect-sel" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 8px;font-size:13px;cursor:pointer;font-family:inherit;outline:none"></select>
      </div>

      <div class="p-section" id="active-section" style="display:none">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">
          <span id="active-cat" class="cat-badge"></span>
          <span id="active-tech" class="tech-badge"></span>
        </div>
      </div>

      <div class="p-section">
        <div class="p-label">Color base</div>
        <div class="color-row">
          <input type="color" id="color-pick" value="#4f9cf9">
          <div class="sw" data-c="#4f9cf9" style="background:#4f9cf9" title="Azul"></div>
          <div class="sw" data-c="#ff6b6b" style="background:#ff6b6b" title="Rojo"></div>
          <div class="sw" data-c="#00ff88" style="background:#00ff88" title="Verde"></div>
          <div class="sw" data-c="#f9c74f" style="background:#f9c74f" title="Amarillo"></div>
          <div class="sw" data-c="#a855f7" style="background:#a855f7" title="Violeta"></div>
        </div>
      </div>

      <div class="p-section">
        <div class="p-label">Intensidad <span id="int-val">80%</span></div>
        <input type="range" id="intensity" min="10" max="100" value="80" step="5">
      </div>

      <div class="p-section">
        <div class="p-label">Exportar</div>
        <div class="export-col">
          <button class="exp-btn" id="btn-cdn">⎘ Copiar snippet CDN</button>
          <button class="exp-btn" id="btn-fs">⤢ Abrir pantalla completa</button>
        </div>
      </div>

      <div class="p-section" style="margin-top:auto">
        <div class="p-label">Controles</div>
        <div class="hint">
          Click izquierdo → explosión<br>
          Click derecho → implosión<br>
          Ratón quieto 2s → autónomo
        </div>
      </div>

    </aside>

    <!-- ── Gallery Grid ── -->
    <main class="grid-area" id="grid-area"></main>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { EFFECTS, AnimatedBG } from './src/index.js';

    // ── State ──────────────────────────────────────────────────────────────
    let color = '#4f9cf9', intensity = 0.8, darkMode = true, activeKey = null;
    const instances = new Map();

    // ── Populate <select> (grouped by category) ────────────────────────────
    const effSel = document.getElementById('effect-sel');
    const catGroups = {};
    for (const [k, m] of Object.entries(EFFECTS)) (catGroups[m.category] ??= []).push([k, m]);
    const emptyOpt = document.createElement('option');
    emptyOpt.value = ''; emptyOpt.textContent = '— Selecciona un efecto —'; emptyOpt.disabled = true; emptyOpt.selected = true;
    effSel.appendChild(emptyOpt);
    for (const [cat, items] of Object.entries(catGroups)) {
      const og = document.createElement('optgroup'); og.label = cat;
      for (const [k, m] of items) {
        const opt = document.createElement('option'); opt.value = k; opt.textContent = m.label; og.appendChild(opt);
      }
      effSel.appendChild(og);
    }

    // ── Build gallery grid ─────────────────────────────────────────────────
    const gridArea = document.getElementById('grid-area');
    const categories = {};
    for (const [key, meta] of Object.entries(EFFECTS)) {
      (categories[meta.category] ??= []).push({ key, ...meta });
    }

    for (const [cat, items] of Object.entries(categories)) {
      const hdr = Object.assign(document.createElement('div'), { className: 'cat-header', textContent: cat });
      gridArea.appendChild(hdr);
      const grid = Object.assign(document.createElement('div'), { className: 'grid' });
      gridArea.appendChild(grid);

      for (const item of items) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.key = item.key;
        card.dataset.cat = item.category;
        card.dataset.label = item.label.toLowerCase();

        const cv = document.createElement('canvas');
        cv.className = 'prev'; cv.width = 260; cv.height = 150;

        card.appendChild(cv);
        card.insertAdjacentHTML('beforeend', `
          <div class="card-info">
            <div class="card-title">${item.label}</div>
            <div class="card-meta">
              <span class="cat-badge">${item.category}</span>
              <span class="tech-badge">${item.tech}</span>
            </div>
          </div>
          <button class="fs-btn" title="Pantalla completa">⤢</button>`);
        grid.appendChild(card);
      }
    }

    // ── Lazy init via IntersectionObserver ─────────────────────────────────
    const io = new IntersectionObserver(entries => {
      for (const { target, isIntersecting } of entries) {
        const key = target.dataset.key;
        const cv  = target.querySelector('canvas');
        if (isIntersecting) {
          if (!instances.has(key)) {
            try {
              instances.set(key, new AnimatedBG(cv, { effect: key, color, intensity, darkMode }).start());
            } catch(e) { console.warn(`Effect "${key}" error:`, e); }
          } else {
            instances.get(key).start();
          }
        } else {
          instances.get(key)?.stop();
        }
      }
    }, { threshold: 0.05, rootMargin: '100px' });

    document.querySelectorAll('.card').forEach(c => io.observe(c));

    // ── Card interaction ───────────────────────────────────────────────────
    gridArea.addEventListener('click', e => {
      const card = e.target.closest('.card'); if (!card) return;
      const key  = card.dataset.key;
      if (e.target.closest('.fs-btn')) {
        openPreview(key); return;
      }
      setActive(key, card);
    });

    function setActive(key, card) {
      activeKey = key;
      // Sync select
      effSel.value = key;
      // Highlight card
      document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', c.dataset.key === key));
      const meta = EFFECTS[key];
      document.getElementById('active-section').style.display = '';
      document.getElementById('active-cat').textContent  = meta.category;
      document.getElementById('active-tech').textContent = meta.tech;
      // Scroll card into view if needed
      const target = card || document.querySelector(`.card[data-key="${key}"]`);
      target?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Select drives the gallery
    effSel.addEventListener('change', () => {
      const key = effSel.value; if (!key) return;
      setActive(key, null);
    });

    function openPreview(key) {
      const eff = key || activeKey || 'lights';
      const url = `preview.html?effect=${eff}&color=${encodeURIComponent(color)}&intensity=${intensity}&dark=${darkMode}`;
      window.open(url, '_blank');
    }

    // ── Control helpers ────────────────────────────────────────────────────
    function applyAll() {
      instances.forEach(bg => bg.setColor(color).setIntensity(intensity).setDarkMode(darkMode));
    }

    // Color
    document.getElementById('color-pick').addEventListener('input', e => { color = e.target.value; applyAll(); });
    document.querySelectorAll('.sw').forEach(s => s.addEventListener('click', () => {
      color = s.dataset.c;
      document.getElementById('color-pick').value = color;
      applyAll();
    }));

    // Intensity
    document.getElementById('intensity').addEventListener('input', e => {
      intensity = +e.target.value / 100;
      document.getElementById('int-val').textContent = e.target.value + '%';
      applyAll();
    });

    // Theme
    const themeBtn = document.getElementById('theme-btn');
    themeBtn.addEventListener('click', () => {
      darkMode = !darkMode;
      document.body.classList.toggle('light', !darkMode);
      themeBtn.textContent = darkMode ? '☀ Modo claro' : '🌙 Modo oscuro';
      applyAll();
    });

    // Search
    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.card').forEach(c => {
        c.classList.toggle('hidden', q && !c.dataset.label.includes(q) && !c.dataset.cat.toLowerCase().includes(q));
      });
      document.querySelectorAll('.cat-header, .cat-header + .grid').forEach(el => {
        const grid = el.classList.contains('grid') ? el : el.nextElementSibling;
        if (!grid) return;
        const anyVisible = [...grid.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
        el.classList.toggle('hidden', !anyVisible);
        if (el.classList.contains('cat-header')) grid?.classList.toggle('hidden', !anyVisible);
      });
    });

    // Export
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    document.getElementById('btn-cdn').addEventListener('click', () => {
      const eff = activeKey || 'lights';
      const snippet = [
        `<canvas id="bg" style="position:fixed;inset:0;width:100%;height:100%"></canvas>`,
        `<script type="module">`,
        `  import { AnimatedBG } from './src/index.js';`,
        `  new AnimatedBG('#bg', { effect: '${eff}', color: '${color}', intensity: ${intensity} }).start();`,
        `<\/script>`,
      ].join('\n');
      navigator.clipboard.writeText(snippet)
        .then(() => toast('✓ Snippet copiado al portapapeles'))
        .catch(() => toast('⚠ Copia manual: ' + snippet.slice(0, 60) + '…'));
    });

    document.getElementById('btn-fs').addEventListener('click', () => openPreview(activeKey || 'lights'));
  </script>
</body>
</html>
